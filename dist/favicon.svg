<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e121b" />
      <stop offset="50%" stop-color="#030305" />
      <stop offset="100%" stop-color="#080811" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGlow)" stroke="url(#borderGrad)" stroke-width="12" />
  <!-- Inner Border Accent -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="4" />
  <!-- Lightning Bolt Icon -->
  <g filter="url(#glow)">
    <path d="M290 64 L160 272 H256 L222 448 L352 240 H256 Z" fill="url(#boltGrad)" />
  </g>
</svg>
