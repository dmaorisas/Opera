<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="50%" stop-color="#030305" />
      <stop offset="100%" stop-color="#0e121b" />
    </linearGradient>

    <!-- Brand Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>

    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowPurple" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glowPurple)" />
  <rect width="1200" height="630" fill="url(#glowCyan)" />

  <!-- Subtle Outer Border -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Brand Logo Badge (Left Top) -->
  <g transform="translate(100, 110)">
    <!-- Icon Container -->
    <rect x="0" y="0" width="96" height="96" rx="24" fill="#0e121b" stroke="url(#primaryGrad)" stroke-width="4" />
    <!-- Bolt Path -->
    <g transform="translate(16, 12) scale(0.13)">
      <path d="M290 64 L160 272 H256 L222 448 L352 240 H256 Z" fill="url(#boltGrad)" />
    </g>

    <!-- Brand Name Text -->
    <text x="124" y="52" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">OPERA <tspan fill="#9ca3af" font-weight="300" font-size="34">by DMAORI</tspan></text>
    <text x="124" y="82" fill="#06b6d4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="3">EFICIENCIA OPERATIVA &amp; IA</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="310" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">
    Transformamos la operación de tu empresa
  </text>

  <!-- Subtitle / Description -->
  <text x="100" y="380" fill="#9ca3af" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">
    Reducimos trabajo manual, optimizamos procesos y eliminamos fricción
  </text>
  <text x="100" y="415" fill="#9ca3af" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">
    mediante tecnología aplicada con foco en resultados.
  </text>

  <!-- Badges / Pillars at bottom -->
  <g transform="translate(100, 485)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="46" rx="23" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="90" y="29" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Optimización</text>

    <!-- Pill 2 -->
    <rect x="196" y="0" width="180" height="46" rx="23" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1.5" />
    <text x="286" y="29" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Digitalización</text>

    <!-- Pill 3 -->
    <rect x="392" y="0" width="180" height="46" rx="23" fill="#FF6B00" fill-opacity="0.15" stroke="#FF6B00" stroke-width="1.5" />
    <text x="482" y="29" fill="#ff8533" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Automatización</text>
  </g>

  <!-- Domain Badge (Bottom Right) -->
  <g transform="translate(930, 490)">
    <text x="170" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="end">dmaori.com</text>
  </g>
</svg>
